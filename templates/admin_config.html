{% extends "base_admin.html" %}
{% block title %}Configuración — Sele Dent Admin{% endblock %}

{% block topbar_titulo %}Configuración{% endblock %}

{% block admin_content %}
<div class="chart-card card-max">
  <div class="chart-header">
    <div><h3>Configuración del sistema</h3><p>Datos de pago y archivo .env</p></div>
  </div>

  <form method="POST" class="frm-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label class="lab">Numero Yape</label>
      <input type="text" name="yape_numero" value="{{ yape_numero }}" class="inp">
    </div>
    <div>
      <label class="lab">Titular Yape</label>
      <input type="text" name="yape_nombre" value="{{ yape_nombre }}" class="inp">
    </div>
    <div>
      <label class="lab">Imagen QR (ruta o URL)</label>
      <input type="text" name="yape_qr" value="{{ yape_qr }}" class="inp">
      <p class="mt-4" style="font-size:11px;color:var(--muted);">
        Ej: <code>static/img/qr_yape.jpg</code> o <code>https://...</code>
      </p>
    </div>
    <div>
      <label class="lab">Monto del adelanto (S/)</label>
      <input type="number" name="adelanto_monto" value="{{ adelanto_monto }}" step="0.01" min="0" class="inp">
    </div>
    <div>
      <button type="submit" class="btn-a btn-solid btn-xl">Guardar cambios</button>
    </div>
  </form>
</div>
{% endblock %}

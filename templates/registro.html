{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}
{% block title %}Crear Cuenta{% endblock %}

{% block content %}

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">

      <div style="margin-bottom:12px">
        <a href="{{ url_for('inicio') }}" style="color:var(--teal);text-decoration:none;font-size:14px;display:inline-flex;align-items:center;gap:6px;">
          <i class="fa-solid fa-arrow-left"></i> Volver al inicio
        </a>
      </div>

      <div class="card shadow p-4">

        <div class="text-center mb-3">
          <img class="login-logo-simple" src="{{ url_for('static', filename='img/trece.png') }}" alt="Logo Clinica Sele Dent">
        </div>

        <h2 class="login-title text-center mb-1">Crear cuenta</h2>
        <p class="login-sub text-center mb-4">Regístrate para poder agendar tus citas</p>

        <form method="POST">

          <div class="field-group">
            <label for="dni">DNI</label>
            <input type="text" id="dni" name="dni" maxlength="8" required placeholder="Ingrese 8 dígitos" autocomplete="off">
          </div>

          <div class="field-group">
            <label for="nombre">Nombres</label>
            <input type="text" id="nombre" name="nombre" readonly>
          </div>

          <div class="field-group">
            <label for="apePaterno">Apellido Paterno</label>
            <input type="text" id="apePaterno" name="apePaterno" readonly>
          </div>

          <div class="field-group">
            <label for="apeMaterno">Apellido Materno</label>
            <input type="text" id="apeMaterno" name="apeMaterno" readonly>
          </div>

          <div class="field-group">
            <label for="correo">Correo (Gmail)</label>
            <input type="email" id="correo" name="correo" required>
          </div>

          <div class="field-group">
            <label for="clave">Contraseña</label>
            <input type="password" id="clave" name="clave" required>
          </div>

          <div class="field-group">
            <label for="confirmar">Confirmar contraseña</label>
            <input type="password" id="confirmar" name="confirmar" required>
          </div>

          <button type="submit" class="btn-login">Registrarse</button>

          <div class="google-btn-wrap">
            <div class="divider">
              <hr><span>o continúa con</span><hr>
            </div>
            <a href="{{ url_for('login_google') }}" class="btn-google-custom">
              <i class="fa-brands fa-google"></i>
              Ingresar con Google
            </a>
          </div>

          <a href="{{ url_for('login') }}" class="btn-register">¿Ya tienes cuenta? Iniciar sesión</a>

        </form>

        <div id="resultado" class="mt-3 text-center font-monospace" style="font-size: 13px;"></div>

      </div>

    </div>
  </div>
</div>

<script>
  const dniInput = document.getElementById("dni");
  const nombreInput = document.getElementById("nombre");
  const apePaternoInput = document.getElementById("apePaterno");
  const apeMaternoInput = document.getElementById("apeMaterno");
  const resultado = document.getElementById("resultado");

  // Detectar cuando el usuario escribe en el campo DNI
  dniInput.addEventListener("input", async () => {
    const dni = dniInput.value.trim();

    // Limpiar formulario y mensaje si no tiene 8 dígitos
    if (dni.length !== 8) {
      limpiarCampos();
      resultado.textContent = "";
      return;
    }

    if (/^\d{8}$/.test(dni)) {
      await consultarDNI(dni);
    }
  });

  async function consultarDNI(dni) {
    resultado.className = "mt-3 text-center text-primary fw-bold";
    resultado.textContent = "Consultando RENIEC...";

    try {
      const response = await fetch(`/api/consultar_dni/${dni}`);
      const res = await response.json();

      if (!res.success || !res.data) {
        resultado.className = "mt-3 text-center text-danger fw-bold";
        resultado.textContent = "❌ No se encontraron datos para este DNI.";
        limpiarCampos();
        return;
      }

      const persona = res.data;

      // Asignación de campos devueltos por Factiliza
      nombreInput.value = persona.nombres || "";
      apePaternoInput.value = persona.apellido_paterno || "";
      apeMaternoInput.value = persona.apellido_materno || "";

      // Limpia el mensaje en pantalla si la carga fue exitosa
      resultado.textContent = "";

    } catch (error) {
      resultado.className = "mt-3 text-center text-danger fw-bold";
      resultado.textContent = "❌ Error al conectar con el servidor.";
      limpiarCampos();
    }
  }

  function limpiarCampos() {
    nombreInput.value = "";
    apePaternoInput.value = "";
    apeMaternoInput.value = "";
  }
</script>

{% endblock %}

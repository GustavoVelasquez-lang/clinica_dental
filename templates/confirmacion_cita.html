{% extends "base.html" %}

{% block title %}Cita Registrada{% endblock %}

{% block content %}

<div class="container d-flex justify-content-center mt-5">

  <div class="card shadow p-4" style="width: 400px;">

    <h3 class="text-center text-success mb-3">
      Cita Agendada
    </h3>

    <hr>

    <div class="mb-3">
      <label class="form-label fw-bold">Especialidad</label>
      <div class="form-control">{{ especialidad }}</div>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">Fecha</label>
      <div class="form-control">{{ fecha }}</div>
    </div>

    <div class="mb-3">
      <label class="form-label fw-bold">Hora</label>
      <div class="form-control">{{ hora }}</div>
    </div>

    {% if mensaje %}
    <div class="mb-3">
      <label class="form-label fw-bold">Mensaje</label>
      <div class="form-control">{{ mensaje }}</div>
    </div>
    {% endif %}

    <hr>

    <div class="d-grid">
      <a href="{{ url_for('inicio') }}" class="btn btn-primary">
        Volver al inicio
      </a>
    </div>

  </div>

</div>

{% endblock %}

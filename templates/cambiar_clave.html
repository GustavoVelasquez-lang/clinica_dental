{% extends "base.html" %}

{% block title %}Cambiar Clave{% endblock %}

{% block content %}
<div class="col-md-4">
  <h3>Cambiar Contraseña</h3>

  <form method="POST">
    
    <div class="mb-3">
      <label class="form-label">Nueva contraseña</label>
      <div class="input-group">
        <input type="password" id="nueva" name="nueva" class="form-control" required>
        <button type="button" class="js-toggle-pw" data-target="nueva"><i class="fa-solid fa-eye"></i></button>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Confirmar contraseña</label>
      <div class="input-group">
        <input type="password" id="confirmar" name="confirmar" class="form-control" required>
        <button type="button" class="js-toggle-pw" data-target="confirmar"><i class="fa-solid fa-eye"></i></button>
      </div>
    </div>

    <button class="btn btn-warning">Actualizar</button>
  </form>
</div>

{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/cambiar_clave.js') }}"></script>
{% endblock %}
